function mkLevel(o){
  let s=o.seed; const R=()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; };
  const L={name:o.name,topic:o.topic,theme:o.theme,tune:o.tune,W:o.W,stones:o.stones,say:o.say,tip:o.tip,boss:!!o.boss,pits:[],plats:[],crits:[],fly:[],springs:[],flags:[]};
  const end=o.boss?o.W-34:o.W-14;
  for(let x=20;x<end;x+=o.gap+Math.floor(R()*6)){
    L.pits.push([x,3]); L.plats.push([x-5,x-3,6]); L.plats.push([x+5,x+7,6]);
    const k=R(); if(k<0.45){ L.springs.push(x+10); L.plats.push([x+12,x+16,3]); } else if(k<0.8){ L.plats.push([x+10,x+14,5]); }
  }
  const nearPit=x=>L.pits.some(([px])=>x>=px-4&&x<=px+8);
  const gapC=o.bots;
  for(let x=14;x<end+8;x+=gapC+Math.floor(R()*4)){ if(!nearPit(x)&&!L.springs.some(sx=>Math.abs(sx-x)<3)) L.crits.push(x); }
  if(o.fly) for(let x=30;x<end;x+=o.fly+Math.floor(R()*8)) L.fly.push(x);
  for(let x=36;x<o.W-10;x+=36) if(!nearPit(x)) L.flags.push(x);
  return L;
}

function tone(f1,f2,dur,type='square',vol=0.08,delay=0){
  if(!AC||muted) return; const t0=AC.currentTime+delay, o=AC.createOscillator(), v=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  v.gain.setValueAtTime(vol,t0); v.gain.exponentialRampToValueAtTime(0.0001,t0+dur); o.connect(v).connect(AC.destination); o.start(t0); o.stop(t0+dur+0.02);
}

const NOTE_I={C:0,D:2,E:4,F:5,G:7,A:9,B:11};

function musicNode(){ if(!music.gain&&AC){ music.gain=AC.createGain(); music.gain.gain.value=0.5; music.gain.connect(AC.destination); } return music.gain; }
function playNote(f,t0,dur,type,vol){
  if(!f) return; const o=AC.createOscillator(), v=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0);
  v.gain.setValueAtTime(0.0001,t0); v.gain.linearRampToValueAtTime(vol,t0+0.008); v.gain.setValueAtTime(vol,t0+Math.max(0.01,dur*0.7)); v.gain.exponentialRampToValueAtTime(0.0001,t0+dur);

function scheduleMusic(){
  const tn=TUNES[music.name]; if(!tn||!AC) return;
  const sixteenth=60/tn.bpm/4, loopDur=tn.L.len*sixteenth;
  while(music.next<AC.currentTime+0.25){
    const loopStart=music.next;
    for(const n of tn.L.notes){ const t0=loopStart+n.at*sixteenth, d=n.len*sixteenth*0.92; playNote(n.f,t0,d,tn.wave||'square',0.04); if(tn.echo) playNote(n.f,t0+sixteenth*1.5,d,'triangle',0.016); }
    for(const n of tn.B.notes){ playNote(n.f,loopStart+n.at*sixteenth,n.len*sixteenth*0.8,'triangle',0.08); }
    music.next+=loopDur;
  }
}

function setDiff(d){ diff=d; saveData.diff=d; persist(); sfx('menu'); }
function updTitle(){
  if(hit.has('left')) setHero('kellan'); if(hit.has('right')) setHero('diana');
  if(hit.has('up')) setDiff(0); if(hit.has('down')) setDiff(1);
  if(confirmHit()&&!hit.has('tap')) { toSelect(firstOpen()); sfx('menu'); }
}
const firstOpen=()=>{ for(let i=0;i<LEVELS.length;i++) if((saveData.stars[i]===undefined)) return i; return 0; };
function updSelect(){
  if(hit.has('left')) { selIdx=(selIdx+LEVELS.length-1)%LEVELS.length; sfx('menu'); }
  if(hit.has('right')) { selIdx=(selIdx+1)%LEVELS.length; sfx('menu'); }
  if(confirmHit()) startLevel(selIdx);
  if(hit.has('pause')) state='title';
}
function updPause(){
  if(confirmHit()||hit.has('pause')) state=pausedFrom;
}
function updEnd(){
  endT++; updFx(); if(endT%12===0&&endT<200) burst(rnd(40,VW-40),rnd(20,60),10,CONFETTI,2.5,50);
  if(endT>50&&(confirmHit()||(hit.has('tap')&&!tapUsed))){ if(lvl===LEVELS.length-1){ state='ending'; endT=0; say('Hooray! You are super bunnies!'); } else toSelect(lvl+1); }
}
function updEnding(){
  endT++; updFx(); if(endT%10===0) burst(rnd(20,VW-20),rnd(10,60),8,CONFETTI,2.5,60);
  if(endT>120&&(confirmHit()||(hit.has('tap')&&!tapUsed))) state='title';
}
function step(){
  t++;
  const mode=state==='play'?'play':'menu'; if(document.body.dataset.mode!==mode) document.body.dataset.mode=mode;
  tapUsed=false;
  if(hit.has('mute')) cycleSound();
  if(hit.has('voice')) toggleVoice();
  if(hit.has('tap')){ for(let i=hot.length-1;i>=0;i--){ const h=hot[i]; if(tapX>=h.x&&tapX<=h.x+h.w&&tapY>=h.y&&tapY<=h.y+h.h){ tapUsed=true; h.fn(); break; } } }
  switch(state){
    case 'title': updTitle(); break;
    case 'select': updSelect(); break;
    case 'play':
      updPlayer(); if(state==='play'){ updCam(); updFx(); if(banner&&t>banner.until) banner=null; if(hit.has('pause')){ pausedFrom='play'; state='pause'; } }
      break;
    case 'pause': updPause(); break;
    case 'levelEnd': updEnd(); break;
    case 'ending': updEnding(); break;
  }
  setMusic(wantedTune());
  hit.clear();
}

const HILL1=Array.from({length:1024},(_,i)=>34+Math.sin(i/37)*14+Math.sin(i/13)*5+Math.sin(i/97)*10);
const HILL2=Array.from({length:1024},(_,i)=>16+Math.sin(i/23+1)*7+Math.sin(i/7)*2+Math.sin(i/61)*6);
function circle(x,y,r){ g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }
function rect(c,x,y,w,h){ g.fillStyle=c; g.fillRect(x|0,y|0,w,h); }
function lerpCol(a,b,f){ const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16); const m=(s)=>Math.round(((pa>>s)&255)*(1-f)+((pb>>s)&255)*f); return `rgb(${m(16)},${m(8)},${m(0)})`; }
function drawBG(th,ox){
  for(let i=0;i<8;i++){ rect(lerpCol(th.sky[0],th.sky[1],i/7),0,i*(PH/8),VW,PH/8+1); }
  const dec=th.deco;
  if(dec==='clouds'||dec==='city'||dec==='masts'||dec==='tents'){
    g.fillStyle='#ffffff'; for(let i=0;i<4;i++){ const x=((i*190-ox*0.2)%760+760)%760-60, y=18+((i*37)%30); circle(x,y,9); circle(x+10,y+2,7); circle(x-9,y+3,6); }
    g.fillStyle='#FFF3A0'; circle(VW-40,26,12);
  }
  if(dec==='cave'){ g.fillStyle='#fff'; for(let i=0;i<30;i++){ const x=((i*97-ox*0.1)%VW+VW)%VW, y=(i*53)%100; g.fillRect(x|0,y,1,1); } g.fillStyle='#241a50'; for(let i=0;i<10;i++){ const x=((i*80-ox*0.5)%(VW+80)+VW+80)%(VW+80)-40; g.beginPath(); g.moveTo(x-10,0); g.lineTo(x+10,0); g.lineTo(x,22+(i*7)%16); g.fill(); } }
  if(dec==='city'){ for(let i=0;i<14;i++){ const bx=((i*58-ox*0.35)%812+812)%812-60, bh=46+((i*37)%52); g.fillStyle=th.bld; g.fillRect(bx,PH-bh-14,34,bh+14); g.fillStyle='#FFE9A0'; for(let wy=0;wy<bh-8;wy+=12) for(let wx=4;wx<30;wx+=10) if((i+wy+wx)%3) g.fillRect(bx+wx,PH-bh-10+wy,4,5); } }
  if(dec==='masts'){ g.fillStyle='#2E5E8A'; for(let i=0;i<7;i++){ const x=((i*80-ox*0.4)%560+560)%560-30; g.fillRect(x,PH-110,2,80); g.beginPath(); g.moveTo(x+2,PH-108); g.lineTo(x+22,PH-70); g.lineTo(x+2,PH-70); g.fill(); } }
  if(dec==='tents'){ for(let i=0;i<5;i++){ const x=((i*130-ox*0.3)%650+650)%650-50; g.fillStyle='#E53935'; g.beginPath(); g.moveTo(x,PH-30); g.lineTo(x+30,PH-84); g.lineTo(x+60,PH-30); g.fill(); g.fillStyle='#fff'; g.beginPath(); g.moveTo(x+18,PH-30); g.lineTo(x+30,PH-84); g.lineTo(x+42,PH-30); g.fill(); g.fillStyle='#FDD835'; g.fillRect(x+29,PH-96,2,14); g.fillRect(x+31,PH-96,8,5); } }
  if(dec!=='city'){ g.fillStyle=th.far; for(let x=0;x<VW;x+=2){ const h=HILL1[(Math.floor(ox*0.3)+x)&1023]; g.fillRect(x,PH-h-30,2,h+30); } }
  g.fillStyle=th.near; for(let x=0;x<VW;x+=2){ const h=HILL2[(Math.floor(ox*0.55)+x)&1023]; g.fillRect(x,PH-h-14,2,h+14); }
}
function drawTiles(th,ox){
  const x0=Math.floor(ox/T), x1=Math.ceil((ox+VW)/T);
  for(let ty=0;ty<LV.H;ty++) for(let tx=x0;tx<=x1;tx++){
    const c=tileAt(tx,ty); if(c===' ') continue; const px=tx*T-ox, py=ty*T;
    if(c==='#'){
      rect(th.ground,px,py,T,T);
      if(!solid(tileAt(tx,ty-1))){ rect(th.grass,px,py,T,4); rect('#00000033',px,py+4,T,1); for(let k=0;k<4;k++) rect(th.grass,px+k*4+1,py+4,2,2); }
      else { rect(th.groundD,px+3,py+4,2,2); rect(th.groundD,px+10,py+9,3,2); rect(th.groundD,px+6,py+13,2,2); }
      if(!solid(tileAt(tx,ty+1))&&ty<LV.H-1) rect(th.groundD,px,py+T-2,T,2);
    } else if(c==='='){
      rect('#00000055',px,py+4,T,5); rect(th.grass,px,py,T,4); rect(th.groundD,px,py+4,T,4); rect(th.ground,px+1,py+4,T-2,3);
    } else if(c==='G'){
      rect('#8A8A9A',px,py,T,T); rect('#5A5A6A',px,py+7,T,2); rect('#5A5A6A',px+((ty&1)?4:11),py,2,8); rect('#5A5A6A',px+((ty&1)?11:4),py+9,2,7); rect('#B8B8C8',px,py,T,1);
    }
  }
}
function starPoly(x,y,r,col){ g.fillStyle=col; g.beginPath(); for(let i=0;i<10;i++){ const rr=i%2?r*0.45:r, a=-Math.PI/2+i*Math.PI/5; i?g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):g.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); } g.closePath(); g.fill(); }
function drawHero(x,y,face,moving,air){
  const fr=HEROES[heroKey].frames, f=air?fr.jump:(moving?(((t>>3)&1)?fr.walk:fr.idle):fr.idle);
  const X=Math.round(x)-3, Y=Math.round(y)-2, ec=heroKey==='kellan'?'#CFE0FF':'#FFE0EE';
  g.drawImage(face>0?f.r:f.l,X,Y);
  // bunny ears: lean back when running fast, spin like a helicopter when floating
  g.lineCap='round';
  const lean=-face*clamp(Math.abs(P.vx)*2.2,0,7);
  for(let i=0;i<2;i++){
    const bx=X+(face>0?5:11)+i*4-(face>0?0:0), by=Y+2;
    let tx=bx+lean+(i?1:-1)*(Math.abs(lean)<2?1.5:0), ty=by-11+(Math.abs(lean)>4?3:0);
    if(P.glide){ const sp=((t>>1)&1)?1:-1; tx=bx+sp*(i?9:-9); ty=by-5; }
    g.strokeStyle='#000'; g.lineWidth=5; g.beginPath(); g.moveTo(bx,by); g.lineTo(tx,ty); g.stroke();
    g.strokeStyle=ec; g.lineWidth=3; g.beginPath(); g.moveTo(bx,by); g.lineTo(tx,ty); g.stroke();
    g.strokeStyle='#FF9EC0'; g.lineWidth=1; g.beginPath(); g.moveTo(bx,by-1); g.lineTo(bx+(tx-bx)*0.8,by+(ty-by)*0.8); g.stroke();
  }
  g.lineCap='butt';
}
function drawEnts(ox){

  for(const s of LV.springs){ const x=s.x-ox, sq=s.squash>0?3:0; rect('#F5E6C8',x+6,s.y+3+sq,4,5-sq); rect('#E53935',x+1,s.y+sq,14,5); rect('#fff',x+4,s.y+1+sq,2,2); rect('#fff',x+10,s.y+2+sq,2,2); }
  // the golden carrot waits at the end of the course
  { const x=(LV.W-3)*T-ox; if(x>-40&&x<VW+40){ const by=top-30+Math.round(Math.sin(t*0.08)*2); rect('#000',x-6,top-3,30,5); rect('#8A8A9A',x-5,top-2,28,3);
      g.drawImage(GOLD,Math.round(x)-2,by,16,20); if((t>>3)&1) starPoly(x+14,by+2,3,'#fff'); else starPoly(x-2,by+12,3,'#FFF3A0'); } }
  if(LV.boss&&LV.boss.alive){ const b=LV.boss, x=b.x-ox; if(x>-60&&x<VW+60&&!(b.flash>0&&((t>>1)&1))){ g.drawImage(b.vx>=0?SL.shell.r:SL.shell.l,Math.round(x),Math.round(b.y)-2,Math.round(b.w*1.05),Math.round(b.h*1.1));
      rect('#000',x-1,b.y-12,b.w+2,6); rect('#E53935',x,b.y-11,Math.round(b.w*b.hp/b.max),4); rect('#FFE14D',x+b.w/2-8,b.y-19,16,4); rect('#000',x+b.w/2-8,b.y-15,16,1); } }
  for(const b of LV.berries) if(!b.got){ const x=b.x-ox; if(x<-10||x>VW+10) continue; g.drawImage(CARROT,Math.round(x),Math.round(b.y+Math.sin(t*0.08+b.ph)*1.5)); }
  for(const c of LV.crits) if(c.alive){ const x=c.x-ox; if(x<-20||x>VW+20) continue;
    if(c.fly) g.drawImage(c.vx>0?SL.buzz.r:SL.buzz.l,Math.round(x)-1,Math.round(c.y)-3);
    else g.drawImage((c.vx>0?SL.shell.r:SL.shell.l),Math.round(x)-2,Math.round(c.y+c.h-11)); }
  if(hist.length>14){ const h=hist[hist.length-14], sp=(Math.abs(P.vx)>0.3)&&((t>>3)&1)?1:0; g.drawImage((P.x>h.x+2||(P.x>=h.x-2&&P.face>0))?SL.pup.r:SL.pup.l,Math.round(h.x-ox)-3,Math.round(h.y+P.h-15-sp)); }
  if(!(P.inv>0&&((t>>2)&1))) drawHero(P.x-ox,P.y,P.face,Math.abs(P.vx)>0.3,!P.ground);
  for(const b of LV.bolts){ const x=b.x-ox; rect('#FFAA00',x-(b.vx>0?5:-1),b.y-1,6,3); rect('#FFE14D',x-2,b.y-2,5,4); rect('#fff',x-1,b.y-1,3,2); }
  for(const p of parts){ g.fillStyle=p.c; const s=p.life>14?2:1; g.fillRect(((p.x-ox)|0),(p.y|0),s,s); }
  for(const x of texts){ const tx=x.x-ox, ty=x.y, c=x.c, s=x.s; post.push(()=>txt(s,tx,ty,6,c,'left')); }
}

function txt(s,x,y,size=8,color='#FFFFFF',align='left',shadow=true){
  cx.font=`${Math.round(size*SC)}px "Press Start 2P", "Courier New", monospace`; cx.textAlign=align; cx.textBaseline='top';
  if(shadow){ cx.fillStyle='#000'; cx.fillText(s,Math.round((x+1)*SC),Math.round((y+1)*SC)); }
  cx.fillStyle=color; cx.fillText(s,Math.round(x*SC),Math.round(y*SC));
}
function wrap(s,maxChars){ const out=[]; let line=''; for(const w of s.split(' ')){ if((line+' '+w).trim().length>maxChars){ out.push(line); line=w; } else line=(line+' '+w).trim(); } if(line) out.push(line); return out; }

  const n=LEVELS.length, tw=Math.min(190,VW-100), tx=(VW-tw)/2, ty=PH-52; rect('#000',tx-1,ty-1,tw+2,14); rect('#B97A3A',tx,ty,tw,12); rect('#fff',tx+4,ty,tw-8,2);
  for(let i=0;i<n;i++) g.drawImage(GOLD,tx+10+i*((tw-34)/(n-1)),ty-18-((endT>>3)+i)%2*2,12,15);
  g.drawImage(HEROES.kellan.frames.idle.r,tx+tw/2-36,PH-34-24+(((endT>>3)&1)*-2)); g.drawImage(HEROES.diana.frames.idle.r,tx+tw/2+14,PH-34-24+(((endT>>3)&1)*-2)); g.drawImage(SL.pup.r,tx+tw/2-10,PH-34-15);
  g.drawImage(SL.shell.l,tx-34,PH-34-14,24,16); g.drawImage(SL.shell.r,tx+tw+10,PH-34-14,24,16);
  for(const p of parts){ g.fillStyle=p.c; g.fillRect(p.x|0,p.y|0,2,2); }
  post.push(()=>{
    txt('HOORAY!',VW/2,10,16,'#FFE14D','center'); txt('CAPTAIN SHELLBOTTOM IS BEATEN!',VW/2,34,6,'#fff','center');
    txt('ALL FIVE GOLDEN CARROTS ARE SAFE!',VW/2,48,6,'#fff','center');
    txt('SUPER BUNNIES: KELLAN, DIANA + BERNIE',VW/2,64,6,'#fff','center');
    if(endT>120&&((t>>4)&1)) txt(coarse?'TAP TO PLAY AGAIN':'PRESS SPACE',VW/2,PH+4,7,'#fff','center');
  });
  blitFlush();
}
function draw(){
  hot.length=0; post.length=0; g.imageSmoothingEnabled=false;
  switch(state){
    case 'title': drawTitle(); break;
    case 'select': drawSelect(); break;
    case 'play': drawPlay(); overlayMsgs(); blitFlush(); break;
    case 'pause': drawPlay(); drawPauseOverlay(); blitFlush(); break;
    case 'levelEnd': drawLevelEnd(); break;
    case 'ending': drawEnding(); break;
  }
}

/* ---------------- sizing and loop ---------------- */
function resize(){
  const app=document.getElementById('app'), r=app.getBoundingClientRect();
  const aspect=r.width/Math.max(1,r.height);
  VW=clamp(Math.round(VH*aspect/2)*2,320,448);
  lo.width=VW; lo.height=VH; g=lo.getContext('2d'); g.imageSmoothingEnabled=false;
  let cw=r.width, ch=cw*VH/VW; if(ch>r.height){ ch=r.height; cw=ch*VW/VH; }
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
  document.documentElement.style.setProperty('--hud',(innerHeight-(r.top+(r.height+ch)/2)+ch*(VH-PH)/VH)+'px');
  const dpr=Math.min(3,window.devicePixelRatio||1); cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr); SC=cv.height/VH;
  if(LV){ camX=clamp(camX,0,Math.max(0,LV.W*T-VW)); }
}
addEventListener('resize',resize); resize();
if(document.fonts&&document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(()=>{});
let acc=0, last=performance.now();
function frame(now){
  acc+=Math.min(100,now-last); last=now;
  // keep the loop alive even if something unexpected throws, so the game never freezes
  try{ if(window.__JJmanual) acc=0; else while(acc>=1000/60){ step(); acc-=1000/60; } }catch(err){ acc=0; hit.clear(); console.error(err); }
  try{ draw(); }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(state==='play'){ pausedFrom='play'; state='pause'; } setMusic(null); try{ speechSynthesis.cancel(); }catch(e){} } });
// test hook for automated play-testing (harmless in normal play)
window.__JJ={get state(){return state;}, set state(v){state=v;}, P, get LV(){return LV;}, LEVELS, startLevel, step, draw, down, hit, get camX(){return camX;}, get berries(){return berries;}, get stars(){return saveData.stars;}, setDiff:d=>{diff=d;}, get diff(){return diff;}, get hot(){return hot;}, get lvl(){return lvl;}, setTap:(x,y)=>{tapX=x;tapY=y;hit.add('tap');}, get VW(){return VW;}, finishLevel, HEROES, SL, loadLevel, solid, tileAt};
requestAnimationFrame(frame);
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
